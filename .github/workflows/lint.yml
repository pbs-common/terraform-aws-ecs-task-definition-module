name: Lint

on:
  pull_request:
    # Run linter when PRs opened or updated
    types: [opened, synchronize]
    branches:
      - main
concurrency: lint-${{ github.base_ref }}
jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: "Checkout"
        uses: actions/checkout@main

      - name: Setup mise
        uses: jdx/mise-action@v4.2.3
        env:
          AQUA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Lint"
        run: ./scripts/lint.sh
